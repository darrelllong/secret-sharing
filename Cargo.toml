[package]
name = "secret-sharing-rs"
version = "0.6.0"
edition = "2021"
license = "BSD-2-Clause"
authors = ["Darrell Long"]
description = "Secret-sharing primitives (Shamir, Blakley, ramp, VSS, CRT, visual, etc.) implemented directly from the original papers; multiprecision arithmetic from the sibling rust-mp crate, no third-party dependencies."
repository = "https://github.com/darrelllong/secret-sharing"
readme = "README.md"
documentation = "https://docs.rs/secret-sharing-rs"
keywords = ["secret-sharing", "shamir", "threshold", "cryptography", "vss"]
categories = ["cryptography", "algorithms"]
# Keep the published tarball focused on what a Rust consumer needs.
# cpp/ is the C++ port, benchmarks/ + assets/ + scripts/ are
# auxiliary; downstream users get them via the GitHub repo, not
# crates.io.
exclude = [
    "cpp/**",
    "assets/**",
    "scripts/**",
    "target/**",
    "pubs/**",
    ".claude/**",
    ".codex/**",
    "pilot_result_*/**",
    "CLAUDE.md",
    "AGENTS.md",
]

[lib]
name = "secret_sharing"
path = "src/lib.rs"

[[bin]]
name = "pilot_ss"
path = "src/bin/pilot_ss.rs"

[dependencies]
# The multiprecision layer (BigUint, Montgomery, number theory), extracted
# to the sibling rump repository: crates.io package rust-mp, lib name rump.
# Same author, same deny(unsafe) and scrub-on-drop policies.
rust-mp = { version = "0.1.0", path = "../rump" }

